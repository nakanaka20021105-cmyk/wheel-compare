# wheel-compare/ フォルダの中身を GitHub Pages に公開するワークフロー
name: Deploy to GitHub Pages

on:
  # main ブランチに push されたら実行
  push:
    branches: [main]
  # GitHub の Actions 画面から手動でも実行できるようにする
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read   # リポジトリのファイルを読む
  pages: write     # Pages に書き込む
  id-token: write  # デプロイ先が正しいことを証明するトークンを発行する

# 同時に複数のデプロイが走らないようにする（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: wheel-compare/ フォルダを公開用にまとめる
        uses: actions/upload-pages-artifact@v4
        with:
          path: wheel-compare

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
